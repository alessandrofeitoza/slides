<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão — Desenvolvimento Web em HTML5, CSS, JS e PHP</title>
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f6f7fb;
  --ink:#1b1f2a;
  --ink-soft:#5a6270;
  --accent:#3454d1;
  --accent-soft:#e7ebfc;
  --good:#1f9d55;
  --good-soft:#e6f7ec;
  --bad:#e0435b;
  --line:#e3e6ee;
  --mono:'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
  --sans:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@font-face{
  font-family:'Inter';
  src:local('Inter');
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
}
#deck{
  position:relative;
  width:100vw;height:100vh;
}
.slide{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:6vh 8vw;
  opacity:0;
  visibility:hidden;
  transform:translateX(40px);
  transition:opacity .45s ease, transform .45s ease;
}
.slide.active{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}
.slide.leaving-back{ transform:translateX(-40px); }

/* ---------- Title & closing ---------- */
.title-slide, .closing-slide{
  text-align:center;
  background:
    radial-gradient(circle at 15% 20%, var(--accent-soft) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #fde9ee 0%, transparent 45%);
}
.title-slide .kicker, .closing-slide .kicker{
  font-size:clamp(1rem,1.6vw,1.4rem);
  color:var(--accent);
  font-weight:600;
  letter-spacing:.02em;
  margin-bottom:1.2rem;
}
.title-slide h1{
  font-size:clamp(2.4rem,5vw,4.2rem);
  line-height:1.08;
  margin:0 0 1.4rem 0;
  font-weight:800;
  max-width:20ch;
}
.title-slide p.sub{
  font-size:clamp(1.2rem,2.1vw,1.7rem);
  color:var(--ink-soft);
  max-width:52ch;
  line-height:1.5;
  margin:0 0 2.2rem 0;
}
.title-meta{
  display:flex;
  gap:2.2rem;
  flex-wrap:wrap;
  justify-content:center;
  font-size:clamp(.95rem,1.4vw,1.15rem);
  color:var(--ink-soft);
  border-top:1px solid var(--line);
  padding-top:1.4rem;
  max-width:60ch;
}
.title-meta span b{color:var(--ink);}
.hint-pill{
  margin-top:2.4rem;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:999px;
  padding:.7rem 1.6rem;
  font-size:clamp(.9rem,1.3vw,1.05rem);
  color:var(--ink-soft);
}
.closing-slide h1{
  font-size:clamp(2.6rem,5.5vw,4.6rem);
  margin:0 0 1rem 0;
  font-weight:800;
}
.closing-slide p{
  font-size:clamp(1.1rem,1.9vw,1.5rem);
  color:var(--ink-soft);
  max-width:46ch;
  line-height:1.55;
}

/* ---------- Divider ---------- */
.divider-slide{
  text-align:center;
  background:linear-gradient(135deg,var(--accent) 0%, #6a3fd1 100%);
  color:#fff;
}
.divider-slide .num{
  font-size:clamp(1.1rem,1.8vw,1.5rem);
  opacity:.75;
  margin-bottom:1rem;
  letter-spacing:.03em;
}
.divider-slide h2{
  font-size:clamp(3rem,4.4vw,3.4rem);
  font-weight:800;
  max-width:22ch;
  line-height:1.15;
}

/* ---------- Question slide ---------- */
.quiz-slide{ align-items:flex-start; }
.q-inner{ width:100%; max-width:1000px; margin:0 auto; }
.q-tag{
  display:inline-block;
  font-size:clamp(.95rem,1.3vw,1.15rem);
  font-weight:700;
  color:var(--accent);
  background:var(--accent-soft);
  padding:.45rem 1.1rem;
  border-radius:999px;
  margin-bottom:1.6rem;
}
.stem{
  font-size:clamp(1.5rem,2.7vw,2.35rem);
  line-height:1.32;
  font-weight:700;
  margin:0 0 1.6rem 0;
  max-width:38ch;
}
.code-block{
  background:#1b1f2a;
  color:#e9edf7;
  font-family:var(--mono);
  font-size:clamp(1.05rem,1.7vw,1.35rem);
  line-height:1.55;
  border-radius:14px;
  padding:1.4rem 1.7rem;
  margin:0 0 1.8rem 0;
  white-space:pre;
  overflow-x:auto;
  max-width:100%;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .5s ease, transform .5s ease;
  position:relative;
}
.code-block.visible{ opacity:1; transform:translateY(0); }
.code-block .cursor{
  display:inline-block;width:.55ch;height:1.1em;background:#8fb0ff;
  margin-left:2px;vertical-align:-.15em;
  animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0;}}

.options{ list-style:none; margin:0; padding:0; width:100%; }
.option{
  display:flex;
  align-items:flex-start;
  gap:1rem;
  background:var(--bg-soft);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:.95rem 1.3rem;
  margin-bottom:.8rem;
  font-size:clamp(1.5rem,1.7vw,1.35rem);
  line-height:1.4;
  opacity:0;
  transform:translateX(18px);
  transition:opacity .4s ease, transform .4s ease, background .3s, border-color .3s;
}
.option.visible{ opacity:1; transform:translateX(0); }
.option .letter{
  flex:0 0 auto;
  width:2.1rem;height:2.1rem;
  border-radius:50%;
  background:#fff;
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;
  font-size:2rem;
}
.option .text code{
  font-family:var(--mono);
  font-size:2rem;
  background:rgba(0,0,0,.05);
  padding:.1em .35em;
  border-radius:5px;
}
.option.reveal-correct{
  background:var(--good-soft);
  border-color:var(--good);
}
.option.reveal-correct .letter{
  background:var(--good);
  border-color:var(--good);
  color:#fff;
}

/* ---------- Answer slide ---------- */
.answer-slide{ align-items:flex-start; background:var(--bg-soft); }
.a-inner{ width:100%; max-width:1400px; margin:0 auto; }
.badge{
  display:inline-flex;
  align-items:center;
  gap:.7rem;
  background:var(--good);
  color:#fff;
  font-weight:800;
  font-size:clamp(1.15rem,2vw,1.55rem);
  padding:.75rem 1.5rem;
  border-radius:999px;
  margin-bottom:1.4rem;
  opacity:0;
  transform:translateY(14px) scale(.95);
  transition:opacity .45s ease, transform .45s ease;
}
.badge.visible{ opacity:1; transform:translateY(0) scale(1); }
.badge .check{
  width:1.7rem;height:1.7rem;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
}
.correct-text{
  font-size:clamp(1.2rem,2.1vw,1.7rem);
  font-weight:700;
  line-height:1.4;
  margin:0 0 1.4rem 0;
  max-width:36ch;
}
.explanation{
  background:#fff;
  border:1.5px solid var(--line);
  border-left:5px solid var(--accent);
  border-radius:12px;
  padding:1.3rem 1.6rem;
  font-size:clamp(1.05rem,1.65vw,1.3rem);
  line-height:1.58;
  color:var(--ink);
  max-width:52ch;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .5s ease, transform .5s ease;
}
.explanation.visible{ opacity:1; transform:translateY(0); }
.explanation .exp-label{
  display:block;
  font-size:.85em;
  font-weight:700;
  color:var(--accent);
  margin-bottom:.4rem;
  text-transform:uppercase;
  letter-spacing:.04em;
}

/* ---------- Chrome: progress + nav ---------- */
#progress-bar{
  position:fixed; top:0; left:0; height:5px;
  background:linear-gradient(90deg,var(--accent),#8a5cf0);
  width:0%;
  transition:width .35s ease;
  z-index:20;
}
#counter{
  position:fixed; bottom:1.4rem; right:1.6rem;
  font-size:.95rem; color:var(--ink-soft);
  font-weight:600;
  background:rgba(255,255,255,.85);
  padding:.35rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  z-index:20;
}
.nav-btn{
  position:fixed; top:50%; transform:translateY(-50%);
  width:3.1rem;height:3.1rem;
  border-radius:50%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:1.3rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:20;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:background .2s, transform .2s;
  user-select:none;
}
.nav-btn:hover{ background:var(--accent-soft); }
.nav-btn:active{ transform:translateY(-50%) scale(.92); }
#prev-btn{ left:1.6rem; }
#next-btn{ right:1.6rem; }
.nav-btn.disabled{ opacity:.25; pointer-events:none; }

.fragment-hint{
  position:fixed; bottom:1.4rem; left:1.6rem;
  font-size:.85rem; color:var(--ink-soft);
  z-index:20;
  opacity:.75;
}

@media (max-width:640px){
  .nav-btn{ width:2.5rem;height:2.5rem;font-size:1.05rem; }
  .stem{ max-width:none; }
  .fragment-hint{ display:none; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="deck"></div>
<button class="nav-btn" id="prev-btn" aria-label="Anterior">←</button>
<button class="nav-btn" id="next-btn" aria-label="Próximo">→</button>
<div id="counter">1 / 1</div>
<div class="fragment-hint">Use ← → para navegar</div>

// ======================= BUILD SLIDES =======================
const deck = document.getElementById('deck');
const slides = [];

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

// Title slide
(function(){
  const s = el('section','slide title-slide');
  s.innerHTML = `
    <div class="kicker">ARA0062 · Desenvolvimento Web em HTML5, CSS, JavaScript e PHP</div>
    <h1>Revisão de Prova — Quiz</h1>
    <p class="sub">${QUIZ.length} questões reunidas das provas SM1 (2026.2, versões A/B) e da semi-prova (2026.3) — fundamentos de HTML, CSS, arquitetura cliente-servidor e semântica.</p>
    <div class="title-meta">
      <span><b>${QUIZ.length}</b> questões</span>
      <span><b>2</b> telas por questão</span>
      <span>Turmas 1001 / 1007</span>
    </div>
    <div class="hint-pill">Leia o enunciado, escolha sua resposta — depois avance para ver o gabarito</div>
  `;
  deck.appendChild(s);
  slides.push({el:s, fragments:[]});
})();

QUIZ.forEach((q, i) => {
  // Question slide
  const qs = el('section','slide quiz-slide');
  const qInner = el('div','q-inner');
  qInner.appendChild(el('div','q-tag', `Questão ${i+1} de ${QUIZ.length} · ${q.tag.split('—')[0].trim()}`));
  qInner.appendChild(el('h2','stem', q.stem));
  const qFragments = [];
  if(q.code){
    const cb = el('div','code-block', escapeHtml(q.code));
    qInner.appendChild(cb);
    qFragments.push(cb);
  }
  const ul = el('ul','options');
  q.options.forEach(opt => {
    const li = el('li','option');
    li.dataset.letter = opt.letter;
    const letterSpan = el('span','letter', opt.letter);
    const textSpan = el('span','text', opt.code ? `<code>${escapeHtml(opt.text)}</code>` : escapeHtml(opt.text));
    li.appendChild(letterSpan);
    li.appendChild(textSpan);
    ul.appendChild(li);
    qFragments.push(li);
  });
  qInner.appendChild(ul);
  qs.appendChild(qInner);
  deck.appendChild(qs);
  slides.push({el:qs, fragments:qFragments});

  // Answer slide
  const as = el('section','slide answer-slide');
  const aInner = el('div','a-inner');
  aInner.appendChild(el('div','q-tag', `Gabarito · Questão ${i+1} de ${QUIZ.length}`));
  const badge = el('div','badge fragment', `<span class="check">✓</span> Alternativa ${q.correct}`);
  const correctOpt = q.options.find(o => o.letter === q.correct);
  const correctText = el('p','correct-text', correctOpt.code ? `<code>${escapeHtml(correctOpt.text)}</code>` : escapeHtml(correctOpt.text));
  const expl = el('div','explanation fragment', `<span class="exp-label">Por quê</span>${escapeHtml(q.explanation)}`);
  aInner.appendChild(badge);
  aInner.appendChild(correctText);
  aInner.appendChild(expl);
  as.appendChild(aInner);
  deck.appendChild(as);
  slides.push({el:as, fragments:[badge, expl]});
});

// Closing slide
(function(){
  const s = el('section','slide closing-slide');
  s.innerHTML = `
    <div class="kicker">Fim da revisão</div>
    <h1>Bom estudo! 🎓</h1>
    <p>Releia as questões em que você teve mais dúvida e volte aos slides de HTML5, CSS e arquitetura cliente-servidor sempre que precisar.</p>
  `;
  deck.appendChild(s);
  slides.push({el:s, fragments:[]});
})();

function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');
}

// ======================= NAVIGATION =======================
let current = 0;
let fragIndex = 0; // number of fragments currently visible on active slide

const progressBar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function renderSlide(dir){
  slides.forEach((s,idx) => {
    s.el.classList.remove('active','leaving-back');
    if(idx === current){
      s.el.classList.add('active');
      if(dir === 'back') s.el.classList.add('leaving-back');
    }
  });
  // sync fragment visibility
  const frags = slides[current].fragments;
  frags.forEach((f, idx) => {
    if(idx < fragIndex){
      f.classList.add('visible');
      if(f.classList.contains('code-block')) f.classList.add('visible');
    } else {
      f.classList.remove('visible');
    }
  });
  progressBar.style.width = (current/(slides.length-1))*100 + '%';
  counter.textContent = `${current+1} / ${slides.length}`;
  prevBtn.classList.toggle('disabled', current===0 && fragIndex===0);
  nextBtn.classList.toggle('disabled', current===slides.length-1 && fragIndex>=frags.length);
}

function goNext(){
  const frags = slides[current].fragments;
  if(fragIndex < frags.length){
    fragIndex++;
    renderSlide('fwd');
  } else if(current < slides.length-1){
    current++;
    fragIndex = 0;
    renderSlide('fwd');
  }
}

function goPrev(){
  if(fragIndex > 0){
    fragIndex--;
    renderSlide('back');
  } else if(current > 0){
    current--;
    fragIndex = slides[current].fragments.length; // show slide fully when arriving from ahead
    renderSlide('back');
  }
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){
    e.preventDefault(); goNext();
  } else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){
    e.preventDefault(); goPrev();
  }
});
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

// init
renderSlide('fwd');
</script>
