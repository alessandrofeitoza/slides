<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principais Tags HTML</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">

<style>
  :root{
    --bg:#ffffff;
    --panel:#f4f5fa;
    --panel-2:#e9ebf5;
    --line: rgba(20,18,40,.14);
    --ink:#15121f;
    --ink-dim:#514c66;
    --amber:#b25b06;
    --mint:#0a8f66;
    --blue:#2453c9;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }

  html{ font-size: 22px; }
  html, .reveal { background: var(--bg); }
  .reveal { font-family: var(--sans); color: var(--ink); }
  .reveal .slides section {
    background: var(--bg);
    text-align:left;
    border-radius: 0;
  }
  .reveal h1, .reveal h2, .reveal h3 { font-family: var(--mono); margin: 0; }
  .reveal ::selection{ background: var(--mint); color:#fff; }
  .reveal .controls{ color: var(--ink); }
  .reveal .progress{ color: var(--mint); height: 8px; }

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family: var(--mono); font-size: 1.3rem; letter-spacing:.14em;
    text-transform: uppercase; color: var(--amber); opacity:.95; margin-bottom: .7rem;
    font-weight:700;
  }
  .br{ color: var(--amber); }

  /* ---------- title slide ---------- */
  .title-slide{ text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  .brand-mark{
    font-family: var(--mono); font-weight:800; letter-spacing:-.02em;
    font-size: clamp(3.6rem, 11vw, 8rem); color: var(--ink);
    animation: brandIn 1s ease both;
  }
  .brand-mark .br{ color: var(--mint); }
  .title-slide h1{ font-family: var(--sans); font-weight:800; font-size: clamp(2.2rem,4.8vw,3.6rem); margin-top:1.2rem; }
  .title-slide .subtitle{ font-family: var(--mono); color: var(--ink-dim); font-size: clamp(1.3rem,2.4vw,1.8rem); margin-top:.7rem; }
  .title-slide .hint{ margin-top: 2.8rem; color: var(--ink-dim); font-size:1.2rem; opacity:.8; }
  @keyframes brandIn{ from{ opacity:0; transform: translateY(18px) scale(.96);} to{opacity:1; transform:none;} }

  /* ---------- divider slides ---------- */
  .divider-slide{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; }
  .divider-icon{ font-size: clamp(4rem,7vw,6.5rem); margin-bottom: .6rem; filter: drop-shadow(0 6px 14px rgba(0,0,0,.12)); }
  .divider-label{ font-family: var(--sans); font-weight:800; font-size: 4rem; color: var(--ink); }
  .divider-chips{ display:flex; gap:.8rem; flex-wrap:wrap; justify-content:center; margin-top:1.8rem; max-width: 78vw; }
  .chip{
    font-family: var(--mono); font-size:1.4rem; color: var(--mint); font-weight:600;
    background: var(--panel-2); border:1px solid var(--line); border-radius: 999px;
    padding:.5rem 1.2rem;
  }

  /* ---------- tag slides ---------- */
  .tag-slide{ height:100%; display:flex; flex-direction:column; justify-content:center; }
  .tag-name{
    font-weight:800; font-size: 3rem; letter-spacing:-.01em;
    animation: tagIn .5s ease both;
  }
  @keyframes tagIn{ from{opacity:0; transform: translateX(-14px);} to{opacity:1; transform:none;} }

  .panels{ display:grid; grid-template-columns: 1.15fr 1fr; gap: 1.8rem; margin: 1.6rem 0 1.4rem; }
  .panel{
    background: var(--panel); border:1px solid var(--line); border-radius: 16px;
    padding: 1.2rem 1.4rem 1.4rem; min-height: 0;
    box-shadow: 0 8px 24px rgba(20,18,40,.08);
  }
  .panel-header{
    display:flex; align-items:center; gap:.5rem; font-family: var(--mono);
    font-size: 1.15rem; letter-spacing:.1em; text-transform:uppercase; color: var(--ink-dim);
    margin-bottom:.7rem; font-weight:600;
  }
  .panel-header .ico{ color: var(--amber); }
  .panel-header .ico.mint{ color: var(--mint); }

  .code-panel pre{ margin:0; background:transparent; box-shadow:none; }
  .code-panel code{
    background:transparent !important; padding:0 !important;
    font-family: var(--mono) !important; font-size: 1.5rem !important;
    line-height:1.55 !important; white-space: pre !important;
  }
  .cursor{
    display:inline-block; width:.5em; height:1.05em; background: var(--mint);
    vertical-align: text-bottom; margin-left:.15em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .browser-mock{ border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .browser-bar{
    display:flex; align-items:center; gap:.5rem; background: var(--panel-2);
    padding:.6rem .8rem;
  }
  .bdot{ width:.7rem; height:.7rem; border-radius:50%; display:inline-block; }
  .bdot.r{ background:#ff6b6b; } .bdot.y{ background:#f5b942; } .bdot.g{ background:#0a8f66; }
  .url{
    font-family: var(--mono); font-size:1rem; color: var(--ink-dim);
    background: #fff; border:1px solid var(--line); border-radius:6px; padding:.25rem .7rem; margin-left:.5rem;
  }
  .loading-bar{ height:3px; width:0; background: var(--mint); }
  .result-panel.fragment.visible .loading-bar{ animation: loadbar .5s ease forwards; }
  @keyframes loadbar{ from{ width:0; } to{ width:100%; } }
  .browser-body{ height: 220px; background:#fff; overflow:auto; }
  .browser-body iframe{
    width:100%; height:100%; border:0; zoom:1.7; transform-origin: top left;
  }

  .uses{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.6rem; }
  .uses li{
    display:flex; align-items:flex-start; gap:.65rem;
    font-size: clamp(1.3rem, 2vw, 1.8rem); color: var(--ink);
  }
  .uses li::before{ content:"▸"; color: var(--mint); font-weight:800; }
  code.inline{
    font-family: var(--mono); background: var(--panel-2); color: var(--amber);
    padding:.08em .42em; border-radius:5px; font-size:.85em; border:1px solid var(--line);
  }

  /* ---------- end slide ---------- */
  .end-slide{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .end-slide h2{ font-family: var(--sans); font-weight:800; font-size: clamp(2.6rem,5.5vw,3.8rem); margin-bottom:1.4rem; }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:.7rem; justify-content:center; max-width:82vw; }
  .thanks{ margin-top:2.2rem; font-size: clamp(1.6rem,3vw,2.3rem); color: var(--ink-dim); }

  /* ---------- question / discussion slides ---------- */
  .question-slide{
    height:100%; max-width: 74vw; margin: 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .q-icon{ font-size: 3.6rem; margin-bottom:.3rem; }
  .q-eyebrow{
    font-family: var(--mono); font-size:1.2rem; letter-spacing:.16em; text-transform:uppercase;
    color: var(--amber); font-weight:700; margin-bottom:1rem;
  }
  .q-title{
    font-family: var(--sans); font-weight:800; font-size: 2.6rem; color: var(--ink); line-height:1.3;
    margin-bottom: 1.8rem;
  }
  .q-points{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.8rem; text-align:left; width:100%; }
  .q-points li{
    font-size: 1.4rem; color: var(--ink-dim); display:flex; align-items:flex-start; gap:.7rem;
  }
  .q-points li::before{ content:"?"; color: var(--amber); font-weight:800; font-family: var(--mono); }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides">

    <section class="title-slide">
      <div class="brand-mark"><span class="br">&lt;</span>html<span class="br">&gt;</span></div>
      <h1>Formulários em HTML</h1>
      <p class="hint">use as setas do teclado para navegar →</p>
    </section>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/plugin/highlight/highlight.min.js"></script>

<script>
const DECK = [

  { id:'formularios', label:'Formulários', icon:'🧾', tags:[
    { tag:'form', code:
`<form action="/enviar" method="post">
  <!-- campos do formulário -->
</form>`,
      uses:[
        'Agrupa campos de entrada de dados',
        '`action` define para onde os dados vão',
        '`method` define GET ou POST'
      ]},
    { tag:'input', code:
`<input type="text" placeholder="Seu nome">
<input type="email" placeholder="seu@email.com">`,
      uses:[
        'Campo de entrada de dados do usuário',
        '`type` muda o comportamento (text, email, password...)',
        '`placeholder` mostra uma dica visual'
      ]},
    { tag:'label', code:
`<label for="nome">Nome:</label>
<input id="nome" type="text">`,
      uses:[
        'Rotula um campo de formulário',
        '`for` conecta o rótulo ao `id` do input',
        'Melhora acessibilidade e a área clicável'
      ]},
    { tag:'button', code:
`<button type="submit">Enviar</button>`,
      uses:[
        'Cria um botão clicável',
        '`type` pode ser submit, button ou reset',
        'Dispara envio de formulários ou ações em JS'
      ]},
  ]},

  {
    id: 'input-output',
    icon: '',
    code: `<form></form>`,
    title: 'Formularios',
    label: 'Entrada e saida de dados',
    tags: [],
    tag: 'form',
  },

  { id:'input-tipos', label:'Tipos de Input', icon:'🎛️', tags:[
    { tag:'input type="text"', code:
`<input type="text" name="nome">`,
      uses:[
        'Campo genérico de texto livre',
        'Tipo padrão quando `type` é omitido',
        'Não valida formato nenhum sozinho'
      ]},
    { tag:'input type="email"', code:
`<input type="email" name="email">`,
      uses:[
        'Valida formato básico de e-mail no navegador',
        'No celular, abre teclado com @ e .com',
        'Ainda assim, valide de novo no servidor'
      ]},
    { tag:'input type="url"', code:
`<input type="url" name="site">`,
      uses:[
        'Valida que o texto começa com http:// ou https://',
        'Ótimo para campos de site ou portfólio',
        'No celular, teclado sugere .com e /'
      ]},
    { tag:'input type="number"', code:
`<input type="number" min="0" max="10" step="1">`,
      uses:[
        'Setas de incremento/decremento nativas',
        '`min`, `max` e `step` limitam o intervalo',
        'Usuário ainda pode digitar fora do range — valide de novo'
      ]},
    { tag:'input type="date"', code:
`<input type="date">`,
      uses:[
        'Abre um calendário nativo do navegador',
        'Valor sempre enviado como AAAA-MM-DD',
        'Aparência varia entre navegador e sistema operacional'
      ]},
    { type:'question',
      title:'Data de nascimento: date nativo ou datepicker customizado?',
      points:[
        '`type="date"` muda de aparência entre Chrome, Safari, Android, iOS — problema pra identidade visual?',
        'Um datepicker próprio dá controle total, mas você reimplementa acessibilidade e teclado do zero',
        'O formato do dado enviado ao back-end muda dependendo da escolha?'
      ]},
    { tag:'input type="color"', code:
`<input type="color" value="#7cf0c2">`,
      uses:[
        'Abre o seletor de cor nativo do sistema',
        'Valor sempre em hexadecimal (#rrggbb)',
        'Pouco controle sobre o estilo do próprio seletor'
      ]},
    { tag:'input type="file"', code:
`<input type="file" accept="image/*" multiple>`,
      uses:[
        'Abre o explorador de arquivos do sistema',
        '`accept` sugere tipos aceitos (não garante!)',
        '`multiple` permite selecionar vários arquivos'
      ]},
    { type:'question',
      title:'Upload de arquivo: o que garantir antes de aceitar?',
      points:[
        'Validar tipo e tamanho no client melhora a UX; validar de novo no servidor é o que garante segurança',
        'Qual limite de tamanho faz sentido pro seu produto e pra sua infraestrutura?',
        'O que fazer com arquivos maliciosos, duplicados ou nomes inválidos?'
      ]},
  ]},

  { id:'input-config', label:'Atributos de Input', icon:'⚙️', tags:[
    { tag:'required / disabled / readonly', chip:'required · disabled · readonly', code:
`<input type="text" required>
<input type="text" disabled value="Não editável">
<input type="text" readonly value="Só leitura">`,
      uses:[
        '`required` impede o envio do formulário se estiver vazio',
        '`disabled` não envia valor nenhum ao servidor',
        '`readonly` envia o valor, mas o usuário não pode editar'
      ]},
    { tag:'placeholder / maxlength / min / max', chip:'placeholder · maxlength · min/max', code:
`<input placeholder="Digite seu nome" maxlength="20">
<input type="number" min="1" max="5">`,
      uses:[
        '`placeholder` é uma dica visual — não confundir com valor real ou com `label`',
        '`maxlength` limita a quantidade de caracteres digitados',
        '`min`/`max` limitam o intervalo de valores aceitos'
      ]},
  ]},

  { id:'selecao', label:'Seleção', icon:'☑️', tags:[
    { tag:'select / optgroup', code:
`<select name="estado">
  <optgroup label="Sul">
    <option value="pr">Paraná</option>
    <option value="sc">Santa Catarina</option>
  </optgroup>
  <optgroup label="Nordeste">
    <option value="ce">Ceará</option>
  </optgroup>
</select>`,
      uses:[
        'Lista suspensa de opções',
        '`optgroup` agrupa opções relacionadas visualmente',
        'Boa escolha quando há muitas opções'
      ]},
    { tag:'input type="radio"', code:
`
    <input type="radio" name="plano"
        value="basico"> Básico

    <input type="radio" name="plano"
        value="pro"> Pro
`,
      uses:[
        'Escolha única entre poucas opções visíveis',
        'Mesmo `name` agrupa os radios — só 1 fica selecionado',
        'Ótimo quando comparar as opções lado a lado importa'
      ]},
    { tag:'input type="checkbox"', code:
`<input type="checkbox" name="termos">
Aceito os termos <br>
<input type="checkbox" name="news" checked>
Quero novidades`,
      uses:[
        'Escolha independente — pode marcar vários ao mesmo tempo',
        '`checked` pré-marca a caixa por padrão',
        'Cada checkbox envia seu valor (ou nada, se desmarcado)'
      ]},
    { type:'question',
      title:'Seleção única: select, radio ou já era decidido?',
      points:[
        'Poucas opções (2 a 4) sempre visíveis → radio costuma ganhar em usabilidade',
        'Muitas opções (10+) → select economiza espaço na tela',
        'Seleção múltipla → checkbox (várias caixas) ou select multiple (bem menos intuitivo)'
      ]},
    { tag:'textarea', code:
`<textarea name="bio" rows="4"
placeholder="Fale sobre você"></textarea>`,
      uses:[
        'Campo de texto livre em várias linhas',
        '`rows` sugere a altura inicial (usuário pode redimensionar)',
        'Sem limite de caracteres nativo — use `maxlength`'
      ]},
    { tag:'button (variações)', code:
`<button type="submit">Enviar</button>
<button type="reset">Limpar</button>
<button type="button" disabled>Indisponível</button>`,
      uses:[
        '`submit` envia o formulário',
        '`reset` limpa todos os campos preenchidos',
        '`type="button"` não faz nada sozinho — precisa de JS'
      ]},
  ]},

  { id:'extras', label:'Outras Tags Úteis', icon:'✨', tags:[
    { tag:'details / summary', code:
`<details>
  <summary>Ver mais detalhes</summary>
  <p>Conteúdo escondido até o clique.</p>
</details>`,
      uses:[
        'Cria um "accordion" nativo, sem nenhum JS',
        '`summary` é o cabeçalho sempre visível',
        'Atributo `open` deixa o bloco expandido por padrão'
      ]},
    { type:'question',
      title:'details/summary nativo ou accordion em JS?',
      points:[
        'Nativo: menos código e acessível por padrão, mas com pouco controle de animação',
        'JS customizado: mais controle visual, porém você reimplementa a acessibilidade',
        'O que pesa mais na decisão: prazo, equipe ou necessidade de animação?'
      ]},
    { tag:'fieldset / legend', code:
`<fieldset>
  <legend>Dados de pagamento</legend>
  <input type="text" placeholder="Número do cartão">
</fieldset>`,
      uses:[
        'Agrupa campos relacionados visual e semanticamente',
        '`legend` nomeia o grupo',
        'Ajuda leitores de tela a entender o contexto do formulário'
      ]},
    { tag:'iframe', code:
`<iframe src="https://exemplo.com" width="300" height="150"></iframe>`,
      uses:[
        'Incorpora outra página dentro da atual',
        'Comum para vídeos, mapas e pagamentos de terceiros',
        'Atenção à segurança — use `sandbox` e permissões'
      ]},
    { tag:'progress', code:
`<progress value="70" max="100"></progress>`,
      uses:[
        'Barra de progresso nativa (upload, carregamento)',
        '`value`/`max` controlam o preenchimento',
        'Sem `value`, vira uma animação "indeterminada"'
      ]},
    { tag:'meter', code:
`<meter value="0.7" min="0" max="1">70%</meter>`,
      uses:[
        'Mede um valor dentro de uma faixa conhecida — não é "progresso" de tarefa',
        'Ótimo para força de senha, uso de cota, avaliação',
        'Semanticamente diferente de `progress`'
      ]},
  ]},
];

function mono(str){ return str.replace(/`([^`]+)`/g, '<code class="inline">$1</code>'); }

function buildDivider(cat){
  const section = document.createElement('section');
  section.className = 'divider-slide';
  const chips = cat.tags.filter(t => t.type !== 'question').map(t => {
    if (t.chip) return `<span class="chip fragment fade-in">${t.chip}</span>`;
    return `<span class="chip fragment fade-in">&lt;${t.tag.split('/')[0].split('…')[0].trim()}&gt;</span>`;
  }).join('');
  section.innerHTML = `
    <div class="divider-icon">${cat.icon}</div>
    <h2 class="divider-label">${cat.label}</h2>
    <div class="divider-chips">${chips}</div>
  `;
  return section;
}

function buildQuestionSlide(q){
  const section = document.createElement('section');
  section.className = 'question-slide';
  section.innerHTML = `
    <div class="q-icon">💭</div>
    <div class="q-eyebrow">Para discutir</div>
    <h2 class="q-title">${q.title}</h2>
    <ul class="q-points"></ul>
  `;
  const ul = section.querySelector('.q-points');
  q.points.forEach(p => {
    const li = document.createElement('li');
    li.className = 'fragment fade-up';
    li.innerHTML = mono(p);
    ul.appendChild(li);
  });
  return section;
}

function buildTagSlide(tag, cat, idx, total){
  const section = document.createElement('section');
  section.className = 'tag-slide';
  section.innerHTML = `
    <!--<div class="eyebrow">${cat.label} · ${idx} de ${total}</div>-->
    <h1 class="tag-name"><span class="br">&lt;</span>${tag.tag}<span class="br">&gt;</span></h1>
    <div class="panels">
      <div class="panel code-panel fragment fade-in">
        <div class="panel-header"><span class="ico">⌨</span>Código</div>
        <pre><code class="language-html hljs" data-trim></code><span class="cursor"></span></pre>
      </div>
      <div class="panel result-panel fragment fade-in">
        <div class="panel-header"><span class="ico mint">▶</span>Resultado</div>
        <div class="browser-mock">
          <div class="browser-bar">
            <span class="bdot r"></span><span class="bdot y"></span><span class="bdot g"></span>
            <span class="url">🔒 resultado.html</span>
          </div>
          <div class="loading-bar"></div>
          <div class="browser-body"><iframe class="live" sandbox=""></iframe></div>
        </div>
      </div>
    </div>
    <ul class="uses"></ul>
  `;
  section.querySelector('code').textContent = tag.code;
  section.querySelector('iframe.live').srcdoc = tag.code;
  const ul = section.querySelector('.uses');
  tag.uses.forEach(u => {
    const li = document.createElement('li');
    li.className = 'fragment fade-up';
    li.innerHTML = mono(u);
    ul.appendChild(li);
  });
  return section;
}

const slidesRoot = document.querySelector('.reveal .slides');
const allTagsFlat = [];

DECK.forEach(cat => {
  slidesRoot.appendChild(buildDivider(cat));
  const realTags = cat.tags.filter(t => t.type !== 'question');
  let idx = 0;
  cat.tags.forEach(item => {
    if (item.type === 'question') {
      slidesRoot.appendChild(buildQuestionSlide(item));
    } else {
      idx++;
      slidesRoot.appendChild(buildTagSlide(item, cat, idx, realTags.length));
      allTagsFlat.push(item);
    }
  });
});

const end = document.createElement('section');
end.className = 'end-slide';
end.innerHTML = `
  <h2>Pronto</h2>
  <div class="chip-grid">
    ${allTagsFlat.map(t => t.chip ? `<span class="chip fragment fade-in">${t.chip}</span>` : `<span class="chip fragment fade-in">&lt;${t.tag.split('/')[0].split('…')[0].trim()}&gt;</span>`).join('')}
  </div>
  <p class="thanks">Até a proxima aula! </p>
`;
slidesRoot.appendChild(end);

Reveal.initialize({
  hash: true,
  controls: true,
  controlsLayout: 'bottom-right',
  controlsTutorial: false,
  progress: true,
  center: false,
  navigationMode: 'linear',
  width: 1280,
  height: 720,
  margin: 0.06,
  transition: 'slide',
  backgroundTransition: 'fade',
  keyboard: { 38: null, 40: null },
  plugins: [ RevealHighlight ]
});
</script>
</body>
</html>
